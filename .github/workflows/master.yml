name: Universal Valve Toolbox - master

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build and package (x64 + x86)
      shell: pwsh
      run: ./build/package.ps1

    - name: Upload zips
      uses: actions/upload-artifact@v4
      with:
        name: uvt-${{ github.sha }}
        path: dist/*.zip

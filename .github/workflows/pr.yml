name: Universal Valve Toolbox - pull request to master

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/UniversalValveToolbox.sln

    - name: Build Debug x64
      run: dotnet build src/UniversalValveToolbox.sln --no-restore -c Debug -p:Platform=x64

    - name: Build Debug x86
      run: dotnet build src/UniversalValveToolbox.sln --no-restore -c Debug -p:Platform=x86

    - name: Build Release x64
      run: dotnet build src/UniversalValveToolbox.sln --no-restore -c Release -p:Platform=x64

    - name: Build Release x86
      run: dotnet build src/UniversalValveToolbox.sln --no-restore -c Release -p:Platform=x86

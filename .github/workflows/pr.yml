name: Universal Valve Toolbox - pull request to master

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/UniversalValveToolbox.sln

    - name: Build Debug
      run: dotnet build src/UniversalValveToolbox.sln -c Debug --no-restore

    - name: Build Release
      run: dotnet build src/UniversalValveToolbox.sln -c Release --no-restore
